<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions — Smart Expense Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="transactions">
  <div id="app-shell" class="dashboard"></div>

  <div id="page-content" hidden>
    <section class="section" id="add-section">
      <div class="section-header"><h2><i class="fa-solid fa-plus"></i> Add Transaction</h2></div>
      <form id="quick-form" class="forms-row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;align-items:end">
        <div class="form-group">
          <label for="quick-type">Type</label>
          <select id="quick-type"><option value="expense">Expense</option><option value="income">Income</option></select>
        </div>
        <div class="form-group">
          <label for="quick-amount">Amount</label>
          <input type="number" id="quick-amount" min="0.01" step="0.01" required />
        </div>
        <div class="form-group" id="quick-category-wrap">
          <label for="quick-category">Category</label>
          <select id="quick-category"></select>
        </div>
        <div class="form-group">
          <label for="quick-date">Date</label>
          <input type="date" id="quick-date" required />
        </div>
        <div class="form-group">
          <label for="quick-description">Description</label>
          <input type="text" id="quick-description" placeholder="Optional" />
        </div>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add</button>
      </form>
    </section>

    <section class="section">
      <div class="section-header">
        <h2><i class="fa-solid fa-list"></i> Transaction History</h2>
        <div class="table-toolbar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="tx-search" placeholder="Search description or category..." />
          </div>
          <div class="filter-group">
            <label for="tx-type-filter">Type</label>
            <select id="tx-type-filter"></select>
          </div>
          <div class="filter-group">
            <label for="tx-category-filter">Category</label>
            <select id="tx-category-filter"></select>
          </div>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th data-sort="date">Date <i class="fa-solid fa-sort sort-icon"></i></th>
              <th>Category</th>
              <th>Description</th>
              <th>Type</th>
              <th data-sort="amount">Amount <i class="fa-solid fa-sort sort-icon"></i></th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="transactions-body"></tbody>
        </table>
      </div>
      <div class="empty-state" id="transactions-empty" hidden>
        <i class="fa-solid fa-receipt"></i>
        <strong>No transactions found</strong>
        <p>Add a transaction or adjust your filters.</p>
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal" role="dialog" aria-labelledby="edit-title">
      <div class="modal-header">
        <h3 id="edit-title">Edit Transaction</h3>
        <button type="button" class="modal-close" id="modal-close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="edit-form">
        <div class="form-group">
          <label for="edit-type">Type</label>
          <select id="edit-type"><option value="expense">Expense</option><option value="income">Income</option></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="edit-amount">Amount</label>
            <input type="number" id="edit-amount" min="0.01" step="0.01" required />
          </div>
          <div class="form-group">
            <label for="edit-date">Date</label>
            <input type="date" id="edit-date" required />
          </div>
        </div>
        <div class="form-group">
          <label for="edit-category">Category</label>
          <select id="edit-category"></select>
        </div>
        <div class="form-group">
          <label for="edit-description">Description</label>
          <input type="text" id="edit-description" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%"><i class="fa-solid fa-check"></i> Save Changes</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
