<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Smart Expense Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page" data-page="signup">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon"><i class="fa-solid fa-user-plus"></i></div>
      <h1>Create Account</h1>
      <p>Start tracking your finances today</p>
    </div>

    <div id="auth-alert"></div>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required />
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="Min. 6 characters" autocomplete="new-password" required />
        </div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" autocomplete="new-password" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>

  <script type="module">
    import { requireGuest, handleSignup } from "./js/auth.js";
    import { applyTheme } from "./js/app.js";

    document.addEventListener("DOMContentLoaded", () => {
      applyTheme();
      requireGuest();
      document.getElementById("signup-form").addEventListener("submit", handleSignup);
    });
  </script>
</body>
</html>
